<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF7F0;
    --cream-border: #EDE6D8;
    --white: #FFFFFF;
    --ink: #201F3D;
    --ink-soft: #9A968A;
    --indigo: #4F46E5;
    --indigo-hover: #4338CA;
    --bot-bg: #F4F2FE;
    --bot-text: #3730A3;
    --placeholder: #B0AB9C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: 100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    background: var(--cream);
    border-right: 1px solid var(--cream-border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
    min-height: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--indigo);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand span {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .sidebar p.tagline {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0;
  }

  .new-convo {
    background: var(--white);
    border: 1px solid var(--cream-border);
    color: var(--indigo);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .new-convo:hover {
    border-color: var(--indigo);
    background: var(--bot-bg);
  }

  .history-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 4px 0 -8px;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 0 -6px;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 8px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.12s ease;
  }

  .history-item:hover {
    background: #F1EBDC;
  }

  .history-item.active {
    background: var(--bot-bg);
    color: var(--bot-text);
    font-weight: 600;
  }

  .history-empty {
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 6px 8px;
  }

  /* ---------- MAIN ---------- */
  .main {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .topbar {
    padding: 20px 48px 16px;
    border-bottom: 1px solid #F1EEE6;
  }

  .topbar h1 {
    font-size: 16.5px;
    font-weight: 700;
    margin: 0 0 3px;
    letter-spacing: -0.01em;
  }

  .topbar p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 64%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .bubble.user {
    background: var(--indigo);
    color: var(--white);
    border-bottom-right-radius: 4px;
  }

  .bubble.bot {
    background: var(--bot-bg);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }

  .bubble.bot .tag {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #6D64C7;
    margin-bottom: 6px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 6px 2px;
  }

  .typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--indigo);
    opacity: 0.4;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  .composer {
    padding: 16px 48px 28px;
  }

  .composer-inner {
    display: flex;
    gap: 8px;
    background: var(--cream);
    border: 1px solid var(--cream-border);
    border-radius: 12px;
    padding: 5px 5px 5px 16px;
  }

  .composer-inner:focus-within {
    border-color: var(--indigo);
  }

  .composer input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: transparent;
    color: var(--ink);
  }

  .composer input::placeholder { color: var(--placeholder); }

  .send-btn {
    background: var(--indigo);
    color: var(--white);
    border: none;
    border-radius: 9px;
    padding: 9px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .send-btn:hover { background: var(--indigo-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #E4DFD0; border-radius: 4px; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .topbar, .chat-scroll, .composer { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L2 8l10 5 10-5-10-5z" fill="#FBF7F0"/>
          <path d="M6 10.5V16c0 1.5 2.5 3 6 3s6-1.5 6-3v-5.5" stroke="#FBF7F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Uni Assistant</span>
    </div>
    <p class="tagline">Attendance, fees, marks, timetable, faculty, library, and policies.</p>
    <button class="new-convo" id="newConvo">+ New conversation</button>

    <div class="history-label">Recent</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No past conversations yet.</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Uni Assistant</h1>
      <p>Ask anything about your university.</p>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="msg-row bot">
        <div class="bubble bot">
          <span class="tag">Uni Assistant</span>
          Ask anything — attendance, fees, marks, timetable, or any university policy.
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <input type="text" id="msgInput" placeholder="Apna sawaal likho..." autocomplete="off">
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>
  </main>
</div>

<script>
  const chatScroll = document.getElementById('chatScroll');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const newConvoBtn = document.getElementById('newConvo');
  const historyList = document.getElementById('historyList');

  const DEFAULT_GREETING = 'Ask anything — attendance, fees, marks, timetable, or any university policy.';

  // The conversation currently open. null means "not started yet" —
  // the backend creates a real id on the first message sent.
  let currentConversationId = localStorage.getItem('uni_assistant_current_conv') || null;

  function addMessage(text, role) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');

    if (role === 'bot') {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'Uni Assistant';
      bubble.appendChild(tag);
      bubble.appendChild(document.createTextNode(text));
    } else {
      bubble.textContent = text;
    }

    row.appendChild(bubble);
    chatScroll.appendChild(row);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="bubble bot">
        <span class="tag">Uni Assistant</span>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    chatScroll.appendChild(row);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function setCurrentConversation(id) {
    currentConversationId = id;
    if (id) {
      localStorage.setItem('uni_assistant_current_conv', id);
    } else {
      localStorage.removeItem('uni_assistant_current_conv');
    }
    renderActiveHighlight();
  }

  function renderActiveHighlight() {
    document.querySelectorAll('.history-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === currentConversationId);
    });
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addMessage(text, 'user');
    msgInput.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversation_id: currentConversationId })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) {
        addMessage('Error: ' + data.error, 'bot');
      } else {
        addMessage(data.answer, 'bot');
        if (data.conversation_id && data.conversation_id !== currentConversationId) {
          setCurrentConversation(data.conversation_id);
        }
        loadConversationList();
      }
    } catch (err) {
      removeTyping();
      addMessage('Connection error — check that the Flask server is running.', 'bot');
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(msgInput.value));
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(msgInput.value);
  });

  newConvoBtn.addEventListener('click', () => {
    setCurrentConversation(null);
    chatScroll.innerHTML = '';
    addMessage(DEFAULT_GREETING, 'bot');
    msgInput.focus();
  });

  async function openConversation(conversationId) {
    try {
      const res = await fetch('/api/history?conversation_id=' + encodeURIComponent(conversationId), {
        method: 'GET',
        credentials: 'same-origin',
      });
      const data = await res.json();
      chatScroll.innerHTML = '';
      if (data.messages && data.messages.length > 0) {
        data.messages.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'bot'));
      } else {
        addMessage(DEFAULT_GREETING, 'bot');
      }
      setCurrentConversation(conversationId);
    } catch (err) {
      console.error('openConversation failed:', err);
    }
  }

  function timeAgo(isoString) {
    if (!isoString) return '';
    const diffMs = Date.now() - new Date(isoString).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  async function loadConversationList() {
    try {
      const res = await fetch('/api/conversations', {
        method: 'GET',
        credentials: 'same-origin',
      });
      const data = await res.json();

      if (data.mongo_connected === false) {
        console.warn('MongoDB is not connected on the server — conversation history will not persist. Check the Flask terminal output.');
      }

      historyList.innerHTML = '';

      if (!data.conversations || data.conversations.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No past conversations yet.</div>';
        return;
      }

      data.conversations.forEach(c => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.dataset.id = c.conversation_id;
        item.title = c.title;
        item.textContent = c.title;
        item.addEventListener('click', () => openConversation(c.conversation_id));
        historyList.appendChild(item);
      });

      renderActiveHighlight();
    } catch (err) {
      console.error('loadConversationList failed:', err);
    }
  }

  async function init() {
    await loadConversationList();
    if (currentConversationId) {
      await openConversation(currentConversationId);
    }
    // If there's no saved conversation, the default greeting already in
    // the page stays as-is.
  }

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();
</script>

</body>
</html>
